<div class="extension-block greetingtitles-settings">
    <div class="inline-drawer">
        <!-- 토글 제목: 기존 텍스트 유지 (가장 큰 위계) -->
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>그리팅 제목 데이터 관리</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        
        <div class="inline-drawer-content">
            <div class="menu-section">
                <!-- 내부 섹션 헤더: 시각적으로 토글보다 작고 깔끔하게 -->
                <div class="section-header">
                    <span class="sub-title">저장된 데이터 목록</span>
                    <p class="memo-hint">캐릭터별로 저장된 제목을 확인하고 관리합니다.</p>
                </div>
                
                <!-- 리스트 컨테이너 -->
                <div id="greeting_titles_list_container" class="scrollable-list custom-scroll">
                    <!-- JS로 생성될 아이템 예시 (디자인 확인용 주석)
                    <div class="title-list-item">
                        <div class="title-header">
                            <strong>캐릭터 이름</strong>
                        </div>
                        <input type="text" class="greeting-title-input" value="그리팅 제목 예시" readonly>
                        <div class="actions">
                            <button class="migrate-btn"><i class="fa-solid fa-file-export"></i> 이동</button>
                            <button class="delete-btn"><i class="fa-solid fa-trash"></i> 삭제</button>
                        </div>
                    </div>
                    -->
                </div>
                
                <!-- 하단 액션 버튼 -->
                <div class="button-row">
                    <button id="refresh_titles_list_btn" class="menu_button">
                        <i class="fa-solid fa-rotate-right"></i>
                        목록 새로고침
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
